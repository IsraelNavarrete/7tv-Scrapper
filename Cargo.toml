[package]
name = "EmotesScrapper"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["fs", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.13.4", features = ["json"] }
json = "0.12.4"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
